# LOCAL DEVELOPMENT ONLY. Not used by the AWS deployment (Dockerfile + k8s.yaml).
#
# Starts PostgreSQL on 127.0.0.1 only, so it is not reachable from other machines.
# Values come from BACKEND/.env (copy .env.example); nothing secret is written here.
#
#   docker compose up -d        start
#   docker compose down         stop (data is kept)
#   docker compose down -v      stop and delete all local data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
